<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>DevOps для разработчиков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: фиксированный сайдбар-«пайплайн» слева, справа колонка урока + оглавление. Цвет акцента — янтарный сигнал сборки. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --fg:#17212c; --muted:#5b6878; --line:#d5dce4;
  --accent:#b35f0c; --accent-fg:#ffffff; --accent-soft:#f7e6d3;
  --ok:#1f7a4a; --ok-soft:#dcf1e4; --bad:#b4322c; --bad-soft:#f8dedc; --warn:#8a6a00; --warn-soft:#f6edc8;
  --code-bg:#e6ebf0; --shadow:0 1px 2px rgba(23,33,44,.06),0 4px 16px rgba(23,33,44,.05);
  --f-display:'Onest','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --side-w:276px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#151c25; --panel-2:#1a2330; --fg:#e3e8ee; --muted:#8e9aab; --line:#27313f;
  --accent:#f0a347; --accent-fg:#1b1206; --accent-soft:#3a2a17;
  --ok:#5ccf8e; --ok-soft:#173326; --bad:#f07a72; --bad-soft:#3b1d1c; --warn:#e6c45a; --warn-soft:#352d12;
  --code-bg:#1d2733; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#151c25; --panel-2:#1a2330; --fg:#e3e8ee; --muted:#8e9aab; --line:#27313f;
  --accent:#f0a347; --accent-fg:#1b1206; --accent-soft:#3a2a17;
  --ok:#5ccf8e; --ok-soft:#173326; --bad:#f07a72; --bad-soft:#3b1d1c; --warn:#e6c45a; --warn-soft:#352d12;
  --code-bg:#1d2733; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
body{color:var(--fg);font:16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
code,kbd,pre{font-family:var(--f-mono);font-size:.88em}
:not(pre)>code{background:var(--code-bg);padding:.1em .38em;border-radius:5px;white-space:nowrap}
pre{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow-x:auto;line-height:1.55;margin:0}
pre .c{color:var(--muted)}
pre .p{color:var(--accent);user-select:none}
.small{font-size:.9rem;color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* каркас */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 40px;z-index:20}
.main{flex:1;min-width:0;margin-left:var(--side-w);padding:0 clamp(16px,4vw,48px) 64px}
.top{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding-block:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .menu{display:none;margin-right:auto}
#view{max-width:1120px}
.scrim{display:none}
@media (max-width:900px){
  .side{transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .side.open+.scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .main{margin-left:0}
  .top .menu{display:inline-flex}
}

/* сайдбар */
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--fg);font:800 1.05rem/1.2 var(--f-display);padding:4px 8px 16px}
.brand svg{flex:none;color:var(--fg)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--fg);font-size:.93rem;line-height:1.35}
.nav a:hover{background:var(--panel-2)}
.nav a.active{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav a.locked{color:var(--muted)}
.nav-label{font:600 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:18px 10px 8px}
.port{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:1.6em;flex:none}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex:none;transform:translateY(-1px)}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.on{border-color:var(--ok);background:var(--ok)}
.lock{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-left:auto}

/* кнопки, поля */
.btn{display:inline-flex;align-items:center;gap:6px;font:600 .92rem/1 var(--f-body);padding:11px 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{font:inherit;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;max-width:100%}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{width:100%;font-family:var(--f-mono);font-size:.82rem}
.status{display:inline-flex;align-items:center;gap:8px;font:500 .78rem/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 12px;text-decoration:none;background:var(--panel)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.warn i{background:var(--bad)}

/* главная */
.eyebrow{font:600 .75rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;gap:14px;padding:8px 0 30px;border-bottom:1px solid var(--line);margin-bottom:30px}
.hero p{max-width:62ch;margin:0;font-size:1.06rem}
.stats{display:flex;gap:clamp(18px,4vw,44px);flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font:700 1.7rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:6px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow)}
.mod:hover{border-color:var(--accent)}
.mod .num{display:flex;justify-content:space-between;align-items:center;font:600 .72rem/1 var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.mod p{margin:0;font-size:.9rem;color:var(--muted);flex:1}
.mod.locked h3,.mod.soon h3{color:var(--muted)}
.mod.soon{background:transparent;box-shadow:none;border-style:dashed}
.tag{font:600 .7rem/1 var(--f-mono);padding:4px 7px;border-radius:5px;background:var(--accent-soft);color:var(--fg);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.muted{background:var(--panel-2);color:var(--muted)}

/* списки уроков */
.crumbs{font:500 .78rem/1.4 var(--f-mono);color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.list a{display:flex;gap:12px;align-items:center;padding:13px 16px;text-decoration:none;color:var(--fg);border-top:1px solid var(--line)}
.list a:first-child{border-top:0}
.list a:hover{background:var(--panel-2)}
.grow{flex:1;min-width:0}

/* урок */
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:44px;align-items:start}
.toc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.toc a{display:flex;gap:8px;color:var(--fg);text-decoration:none;padding:5px 8px;border-radius:6px;line-height:1.35}
.toc a:hover{background:var(--panel-2)}
.toc a.active{background:var(--accent-soft);font-weight:600}
.toc a.sub{color:var(--muted);padding-left:24px}
.toc .dot{margin-top:6px}
@media (max-width:1100px){.lesson-grid{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.prose{max-width:72ch}
.prose>*+*{margin-top:1em}
.prose h3{margin-top:1.9em}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:.35em}
.prose p,.prose li{text-wrap:pretty}
.note{background:var(--accent-soft);border-radius:8px;padding:14px 16px}
.note.ok{background:var(--ok-soft)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child th{border-top:0}
th{font:600 .75rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
td code{white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 .82rem/1.2 var(--f-mono)}
.flow span{border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px}
.flow b{color:var(--muted);font-weight:400}
.flow span.hl{border-color:var(--accent);background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cols>div{min-width:0;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.cols>div>b{display:block;font-family:var(--f-display);margin-bottom:4px}

/* вопросы */
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px;background:var(--panel)}
.qh{display:flex;justify-content:space-between;gap:10px;font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qp{margin:10px 0;font-weight:500}
.q pre{margin-bottom:10px}
.qb{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ordl{display:flex;flex-direction:column;gap:6px}
.ordi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel)}
.ordi .t{flex:1;min-width:0}
.ordi button{font:600 .9rem/1 var(--f-mono);width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--fg);cursor:pointer}
.ordi button:disabled{opacity:.3;cursor:default}
.ordi.right{border-color:var(--ok);background:var(--ok-soft)}
.ordi.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center}
.mrow select{width:100%}
.mrow select.right{border-color:var(--ok)}
.mrow select.wrong{border-color:var(--bad)}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}}
.fb{margin-top:12px;padding:11px 14px;border-radius:8px;font-size:.94rem}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{margin-right:6px}
.result{text-align:center;padding:26px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:18px 0}
.result .big{font:800 3rem/1 var(--f-mono)}
.timer{font:700 1.2rem/1 var(--f-mono);padding:8px 12px;border:1.5px solid var(--accent);border-radius:8px;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:10px;padding:12px 16px;margin-bottom:20px}
.confirm{background:var(--bad-soft);border-radius:10px;padding:14px 16px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:8px;font-size:.92rem;z-index:50;max-width:calc(100vw - 32px)}
.gl-item{padding:11px 0;border-bottom:1px solid var(--line)}

/* виджеты */
.widget{border:1.5px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);display:grid;gap:14px}
.wlabel{font:600 .7rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{font:600 .78rem/1.2 var(--f-mono);padding:8px 10px;border-radius:6px;border:1.5px solid var(--line);color:var(--muted);background:var(--panel-2)}
.stage.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.stage.cur{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.stage.fail{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.perm{display:grid;grid-template-columns:auto repeat(3,minmax(44px,64px));gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:.88rem}
.perm label{display:flex;justify-content:center}
.perm input{width:20px;height:20px;accent-color:var(--accent)}
.bigcode{font:600 1.15rem/1.3 var(--f-mono);background:var(--code-bg);padding:10px 14px;border-radius:8px;overflow-x:auto;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.kv div{background:var(--panel-2);border-radius:8px;padding:9px 12px;min-width:0}
.kv span{display:block;font-size:.78rem;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:.92rem;overflow-wrap:anywhere}
.layers{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:.84rem}
.layer{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;border:1.5px solid var(--line);min-width:0}
.layer code{flex:1;min-width:0;background:none;padding:0;white-space:pre;overflow-x:auto}
.layer .st{font-size:.72rem;font-weight:600;white-space:nowrap}
.layer.cached{border-color:var(--ok)}
.layer.cached .st{color:var(--ok)}
.layer.rebuild{border-color:var(--accent);background:var(--accent-soft)}
.layer.rebuild .st{color:var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 .82rem/1 var(--f-body);padding:9px 12px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.pods{display:flex;flex-wrap:wrap;gap:8px}
.pod{width:62px;height:52px;border-radius:8px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 .74rem/1.2 var(--f-mono);background:var(--panel-2);color:var(--muted)}
.pod.v2{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.pod.starting{border-style:dashed}
.pod.term{opacity:.35;text-decoration:line-through}
.pod small{font-weight:400;font-size:.66rem}
.envbox{display:grid;gap:8px}
.envbox .lbl{font:600 .72rem/1 var(--f-mono);color:var(--muted)}
.traffic{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.traffic i{display:block;height:100%}
.runs{margin:0;padding-left:1.2em;font-family:var(--f-mono);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <aside id="side" class="side" aria-label="Навигация по курсу"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="btn ghost sm menu" id="menuBtn" aria-label="Открыть меню">☰ Меню</button>
      <a class="status" id="saveStatus" href="#/progress"><i></i><span>Сохранено в браузере</span></a>
      <button class="btn ghost sm" id="themeBtn">◐ Тема</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<script>

// ====== КОНТЕНТ КУРСА: модули 0–2 ======
const MODULES = [];

MODULES.push({
  id:0, title:'Общая картина', short:'Путь кода до прода, культура DevOps, метрики DORA',
  lessons:[
{ id:'0-1', title:'Путь кода от коммита до продакшена',
html:`
<p>Разработчик дописал фичу и сделал <code>git push</code>. Через 15 минут её видят пользователи, и при этом никто не заходил на сервер руками. Весь курс — о том, как устроен этот путь. Вот он целиком: пройдите его по шагам и попробуйте «уронить» тесты.</p>
<div data-widget="pipeline"></div>
<h3>Цепочка и модули курса</h3>
<ol>
<li><b>Код и история изменений.</b> Ветки, пулл-реквесты, ревью (модуль 3, Git).</li>
<li><b>Непрерывная интеграция (CI).</b> На каждый push сервер сборки собирает проект и гоняет тесты (модуль 5).</li>
<li><b>Упаковка.</b> Приложение вместе с зависимостями собирается в образ контейнера (модуль 4, Docker).</li>
<li><b>Доставка.</b> Образ раскатывается на staging, затем на прод без простоя (модули 5–6).</li>
<li><b>Где это всё работает.</b> Серверы на Linux (модули 1–2), оркестратор Kubernetes (модуль 6), инфраструктура, описанная кодом (модуль 7).</li>
<li><b>Наблюдение.</b> Метрики, логи и алерты показывают, что релиз не сломал прод (модуль 9).</li>
</ol>
<div class="note"><b>Зачем это разработчику.</b> В командах с DevOps-практиками разработчик сам отвечает за то, как его код собирается, запускается и ведёт себя в проде. Понимая конвейер, вы читаете упавший пайплайн, чините Dockerfile и находите, почему под не стартует, не дожидаясь отдельного специалиста.</div>
<h3>Базовые слова</h3>
<ul>
<li><b>Окружение (environment)</b> — отдельная копия системы: <code>dev</code> для разработки, <code>staging</code> для проверки, <code>production</code> для пользователей.</li>
<li><b>Артефакт</b> — результат сборки, который потом разворачивают: бинарник, jar-файл, архив, Docker-образ.</li>
<li><b>Пайплайн (конвейер)</b> — автоматическая последовательность шагов от коммита до деплоя.</li>
<li><b>Деплой</b> — установка новой версии в окружение. <b>Релиз</b> — момент, когда пользователи получают изменение. Их можно разделить фича-флагами: код уже задеплоен, но функция включится позже.</li>
</ul>`,
check:[

{ id:'0-2', title:'Что такое DevOps',
html:`
<p>Исторически разработчики (Dev) отвечали за новые фичи, а эксплуатация (Ops) — за стабильность серверов. Цели противоречили друг другу: одни хотели выпускать чаще, другие — менять как можно реже. Код «перебрасывали через стену», релизы шли раз в квартал, а ночные аварии разбирали люди, которые этот код не писали.</p>
<p><b>DevOps</b> — набор практик и культура, которые убирают эту стену: одна команда отвечает за сервис целиком, от кода до работы в проде, и автоматизирует всё, что повторяется. Формула Amazon: <i>you build it, you run it</i>.</p>
<h3>Модель CALMS</h3>
<div class="cols">
<div><b>Culture</b>Общая ответственность, разборы инцидентов без поиска виноватых.</div>
<div><b>Automation</b>Сборка, тесты, деплой и инфраструктура выполняются машиной, а не по инструкции в вики.</div>
<div><b>Lean</b>Маленькие порции изменений, короткий путь до пользователя, меньше ожидания.</div>
<div><b>Measurement</b>Решения на основе метрик: частота деплоев, ошибки, время восстановления.</div>
<div><b>Sharing</b>Общие инструменты, знания и дежурства между разработкой и эксплуатацией.</div>
</div>
<h3>DevOps — это не должность</h3>
<p>Вакансия «DevOps-инженер» обычно означает человека, который строит CI/CD, платформу и инфраструктуру. Но если в компании есть «DevOps-отдел», куда разработчики пишут тикеты «задеплойте мне», стена просто переехала. Соседние подходы:</p>
<ul>
<li><b>SRE (Site Reliability Engineering)</b> — подход Google: эксплуатацию решают как инженерную задачу, надёжность измеряют через SLO и бюджет ошибок.</li>
<li><b>Platform engineering</b> — отдельная команда делает внутреннюю платформу «самообслуживания», чтобы продуктовые команды деплоили сами.</li>
</ul>
<div class="note warn"><b>Типичный антипаттерн.</b> Купили Kubernetes и Jenkins, но релиз по-прежнему раз в месяц после согласования в трёх чатах. Инструменты без изменения процесса скорость не дают.</div>`,
check:[
{ id:'c0-2a', type:'multiple', prompt:'Какие элементы входят в модель CALMS?', options:['Culture','Automation','Measurement','Licensing','Monitoring only'], answer:[0,1,2], explanation:'CALMS: Culture, Automation, Lean, Measurement, Sharing.' },
{ id:'c0-2b', type:'single', prompt:'Что означает принцип «you build it, you run it»?', options:['Команда, написавшая сервис, отвечает и за его работу в проде','Каждый разработчик собирает проект только локально','Эксплуатацией занимается отдельный отдел','Запускать можно только то, что собрано на своём ноутбуке'], answer:0, explanation:'Ответственность не передаётся через стену: авторы кода получают обратную связь от прода.' }
]},
{ id:'0-3', title:'Как измерить: метрики DORA',
html:`
<p>Исследовательская программа DORA (DevOps Research and Assessment) много лет опрашивает тысячи команд и выделила четыре метрики, которые отличают сильные команды от слабых. Две из них про скорость, две — про стабильность.</p>
<div class="tbl"><table>
<tr><th>Метрика</th><th>Что измеряет</th><th>Сильные команды</th></tr>
<tr><td>Deployment frequency</td><td>Как часто деплоим в прод</td><td>По требованию, несколько раз в день</td></tr>
<tr><td>Lead time for changes</td><td>Время от коммита до прода</td><td>Меньше суток</td></tr>
<tr><td>Change failure rate</td><td>Доля деплоев, вызвавших сбой или откат</td><td>Около 5–15%</td></tr>
<tr><td>Time to restore service</td><td>Сколько чиним сервис после сбоя</td><td>Меньше часа</td></tr>
</table></div>
<h3>Скорость и стабильность не враги</h3>
<p>Главный вывод исследований: команды, которые деплоят чаще, ломают прод <b>реже</b>. Маленькое изменение проще проверить, проще понять, что именно сломалось, и проще откатить. Большой релиз раз в квартал содержит сотни изменений, и при сбое непонятно, какое виновато.</p>
<h3>Как это считать на практике</h3>
<ul>
<li>Частоту и lead time берут из CI/CD: время коммита и время успешного деплоя.</li>
<li>Change failure rate — из инцидентов и откатов, связанных с деплоем.</li>
<li>Время восстановления — от начала инцидента до его закрытия.</li>
</ul>
<div class="note"><b>Не превращайте метрики в KPI.</b> Если премию платят за число деплоев, команда начнёт деплоить пустые коммиты. Метрики нужны, чтобы находить узкие места в процессе, а не чтобы сравнивать людей.</div>`,
check:[
{ id:'c0-3a', type:'match', prompt:'Сопоставьте метрику DORA и что она измеряет.', pairs:[['Deployment frequency','Как часто выкатываем в прод'],['Lead time for changes','Время от коммита до прода'],['Change failure rate','Доля неудачных деплоев'],['Time to restore','Время восстановления после сбоя']], explanation:'Первые две метрики про скорость, вторые две — про стабильность.' },
{ id:'c0-3b', type:'input', prompt:'Сколько ключевых метрик выделяет DORA? Введите число.', answer:['4','четыре'], explanation:'Четыре: частота деплоев, lead time, change failure rate, время восстановления.' }
]}
  ],
  test:[
{ id:'t0-1', l:'0-1', type:'single', prompt:'Чем деплой отличается от релиза?', options:['Деплой — установка версии в окружение, релиз — момент, когда пользователи получают изменение','Это синонимы','Релиз выполняется только вручную','Деплой бывает только на staging'], answer:0, explanation:'Фича-флаги позволяют задеплоить код заранее, а включить (зарелизить) потом.' },
{ id:'t0-2', l:'0-1', type:'single', prompt:'Зачем нужен staging?', options:['Проверить новую версию в окружении, максимально похожем на прод, до пользователей','Хранить резервные копии базы','Собирать Docker-образы','Запускать юнит-тесты'], answer:0, explanation:'Staging повторяет прод по конфигурации, но без реальных пользователей.' },
{ id:'t0-3', l:'0-1', type:'single', prompt:'Тесты в CI упали. Что происходит с конвейером?', options:['Он останавливается, дальше в окружения ничего не уходит','Код всё равно деплоится, но с пометкой','Тесты перезапускаются до успеха','Деплой идёт только на прод'], answer:0, explanation:'Смысл конвейера — не пропускать сломанный код дальше.' },
{ id:'t0-4', l:'0-2', type:'single', prompt:'Какая ситуация — антипаттерн DevOps?', options:['Разработчики пишут тикеты в «DevOps-отдел», чтобы тот задеплоил их код','Команда сама деплоит свой сервис через пайплайн','После инцидента проводят разбор без поиска виноватых','Инфраструктура описана в коде'], answer:0, explanation:'Это та же стена между Dev и Ops, только с новым названием.' },
{ id:'t0-5', l:'0-2', type:'multiple', prompt:'Что относится к DevOps-практикам?', options:['Автоматизация сборки и деплоя','Маленькие частые изменения','Разборы инцидентов без поиска виноватых','Релизы раз в квартал с ручной установкой'], answer:[0,1,2], explanation:'Редкие ручные релизы — как раз то, от чего DevOps уходит.' },

{ id:'t0-9', l:'0-3', type:'single', prompt:'Почему метрики DORA плохо работают как KPI для премий?', options:['Их начинают «накручивать», и они перестают отражать реальность','Их невозможно посчитать','Они секретные','Они подходят только для Google'], answer:0, explanation:'Закон Гудхарта: когда мера становится целью, она перестаёт быть хорошей мерой.' }

  id:1, title:'Linux для DevOps', short:'Файлы и права, процессы, systemd, ресурсы и логи',

{ id:'1-1', title:'Файловая система и права',
html:`
<p>Почти все серверы и контейнеры работают на Linux. В нём «всё есть файл»: конфиги, логи, устройства и даже информация о процессах. Поэтому первое, что нужно, — знать, где что лежит и кто имеет доступ.</p>
<h3>Где что лежит</h3>
<div class="tbl"><table>
<tr><th>Путь</th><th>Что там</th></tr>
<tr><td><code>/etc</code></td><td>Конфигурация системы и сервисов: <code>/etc/nginx/nginx.conf</code>, <code>/etc/hosts</code></td></tr>
<tr><td><code>/var/log</code></td><td>Логи. <code>/var/lib</code> — данные сервисов (например, базы)</td></tr>
<tr><td><code>/home/имя</code>, <code>/root</code></td><td>Домашние каталоги пользователей и root</td></tr>
<tr><td><code>/usr/bin</code>, <code>/usr/local/bin</code></td><td>Программы. Свои скрипты кладут в <code>/usr/local/bin</code></td></tr>
<tr><td><code>/tmp</code></td><td>Временные файлы, очищаются при перезагрузке</td></tr>
<tr><td><code>/proc</code>, <code>/sys</code></td><td>Виртуальные файлы ядра: процессы, память, устройства</td></tr>
</table></div>
<h3>Права доступа</h3>
<p>У каждого файла есть владелец, группа и три набора прав: для владельца (u), группы (g) и остальных (o). Права: <b>r</b> — чтение, <b>w</b> — запись, <b>x</b> — выполнение (для каталога — право в него войти).</p>
<pre><span class="p">$ </span>ls -l deploy.sh
-rwxr-x--- 1 deploy devs 812 Oct 12 10:31 deploy.sh
<span class="c"># тип | u=rwx | g=r-x | o=--- | владелец deploy | группа devs</span></pre>
<p>Права удобно записывать числом: r=4, w=2, x=1, сумма для каждой тройки. <code>rwxr-x---</code> — это 750. Покрутите калькулятор:</p>
<div data-widget="chmod"></div>
<h3>Главные команды</h3>
<pre>chmod 640 app.conf          <span class="c"># права числом</span>
chmod +x script.sh          <span class="c"># добавить выполнение всем</span>
chown deploy:devs app.conf  <span class="c"># сменить владельца и группу</span>
sudo -u postgres psql       <span class="c"># выполнить команду от другого пользователя</span>
id                          <span class="c"># кто я и в каких группах</span></pre>
<div class="note warn"><b>Не делайте <code>chmod 777</code>.</b> Если «не хватает прав», найдите, от какого пользователя работает процесс, и выдайте права именно ему. 777 разрешает любому пользователю системы подменить файл.</div>`,
check:[
{ id:'c1-1a', type:'input', prompt:'Какое число соответствует правам `rw-r--r--`?', answer:['644'], explanation:'rw- = 4+2 = 6, r-- = 4, r-- = 4.' },
{ id:'c1-1b', type:'single', prompt:'Где обычно искать конфигурационный файл nginx?', options:['/etc/nginx/','/var/log/nginx/','/tmp/nginx/','/proc/nginx/'], answer:0, explanation:'Конфигурация живёт в /etc, а логи nginx — в /var/log/nginx.' }
]},
{ id:'1-2', title:'Процессы и сигналы',
html:`
<p>Процесс — запущенная программа. У каждого есть номер <b>PID</b>, родитель (PPID), пользователь, от которого он работает, и потребляемые ресурсы.</p>
<pre><span class="p">$ </span>ps aux | grep node
deploy  2143  3.1  4.2 1084512 171300 ?  Ssl 10:02  0:41 node dist/server.js
<span class="c"># USER   PID  %CPU %MEM   VSZ     RSS        START  TIME  COMMAND</span></pre>
<p>Интерактивно смотреть процессы удобно в <code>top</code> или <code>htop</code>: сортировка по CPU и памяти, нагрузка, свободная память.</p>
<h3>Сигналы</h3>
<p>Процессу можно отправить сигнал командой <code>kill</code>. Название обманчивое: она не обязательно убивает.</p>
<div class="tbl"><table>
<tr><th>Сигнал</th><th>Номер</th><th>Что значит</th></tr>
<tr><td>SIGTERM</td><td>15</td><td>Вежливая просьба завершиться. Процесс может доделать запросы, закрыть соединения. Отправляется по умолчанию</td></tr>
<tr><td>SIGKILL</td><td>9</td><td>Немедленное убийство ядром. Перехватить нельзя, процесс ничего не успеет сохранить</td></tr>
<tr><td>SIGINT</td><td>2</td><td>То, что отправляет Ctrl+C</td></tr>
<tr><td>SIGHUP</td><td>1</td><td>Многие демоны (nginx) перечитывают по нему конфиг</td></tr>
</table></div>
<pre>kill 2143        <span class="c"># SIGTERM</span>
kill -9 2143     <span class="c"># SIGKILL — только если TERM не помог</span>
pkill -f server.js</pre>
<h3>Коды выхода</h3>
<p>Завершаясь, процесс возвращает число: <code>0</code> — успех, всё остальное — ошибка. Код последней команды лежит в <code>$?</code>. На кодах выхода построены CI и скрипты: шаг с ненулевым кодом считается упавшим. Код 137 = 128 + 9 означает, что процесс убили SIGKILL — часто это OOM killer.</p>
<div class="note"><b>Почему это важно в контейнерах.</b> При остановке Docker и Kubernetes шлют главному процессу SIGTERM и ждут (по умолчанию 10 и 30 секунд), затем SIGKILL. Если приложение не обрабатывает SIGTERM, оно обрывает запросы на полуслове при каждом деплое.</div>`,
check:[
{ id:'c1-2a', type:'single', prompt:'Какой сигнал нельзя перехватить и обработать в приложении?', options:['SIGKILL (9)','SIGTERM (15)','SIGHUP (1)','SIGINT (2)'], answer:0, explanation:'SIGKILL выполняется ядром, процесс о нём не узнаёт.' },
{ id:'c1-2b', type:'analyze', prompt:'Контейнер завершился так. Что, вероятнее всего, случилось?', code:'$ docker inspect -f "{{.State.ExitCode}} {{.State.OOMKilled}}" api\n137 true', options:['Процесс превысил лимит памяти, и его убили SIGKILL','Приложение штатно завершилось','Не нашёлся файл конфигурации','Ошибка синтаксиса в коде'], answer:0, explanation:'137 = 128 + 9 (SIGKILL), а OOMKilled=true прямо говорит о нехватке памяти.' }
]},
{ id:'1-3', title:'systemd и сервисы',
html:`
<p>Если на сервере нужно, чтобы приложение запускалось при загрузке и поднималось после падения, его оформляют как сервис <b>systemd</b>. Это система инициализации почти всех современных дистрибутивов: процесс с PID 1, который запускает и следит за остальными.</p>
<h3>Unit-файл</h3>
<pre><span class="c"># /etc/systemd/system/api.service</span>
[Unit]
Description=Orders API
After=network-online.target

[Service]
User=deploy
WorkingDirectory=/opt/api
EnvironmentFile=/etc/api.env
ExecStart=/usr/bin/node dist/server.js
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target</pre>
<ul>
<li><code>User</code> — не запускайте сервисы от root без нужды.</li>
<li><code>Restart=on-failure</code> — перезапуск при ненулевом коде выхода.</li>
<li><code>WantedBy=multi-user.target</code> — запускать при обычной загрузке системы.</li>
</ul>
<h3>Управление</h3>
<pre>sudo systemctl daemon-reload        <span class="c"># перечитать unit-файлы после правки</span>
sudo systemctl enable --now api     <span class="c"># автозапуск + запустить сейчас</span>
systemctl status api                <span class="c"># состояние, PID, последние строки лога</span>
sudo systemctl restart api
journalctl -u api -f                <span class="c"># лог сервиса в реальном времени</span>
journalctl -u api --since "1 hour ago"</pre>
<div class="note"><b>Частая ошибка.</b> Поправили unit-файл, сделали <code>restart</code>, а изменения не применились. Сначала нужен <code>daemon-reload</code>: systemd кэширует описания юнитов.</div>
<p>В Kubernetes роль systemd по перезапуску и слежению за процессами берут на себя kubelet и контроллеры, но на виртуалках, базах и раннерах CI systemd встречается постоянно.</p>`,
check:[
{ id:'c1-3a', type:'single', prompt:'Какая команда включит автозапуск сервиса при загрузке и сразу его запустит?', options:['systemctl enable --now api','systemctl start api','systemctl reload api','journalctl -u api'], answer:0, explanation:'enable создаёт автозапуск, флаг --now ещё и запускает сервис сейчас.' },
{ id:'c1-3b', type:'input', prompt:'Какой командой посмотреть лог сервиса api в реальном времени? (journalctl …)', answer:['journalctl -u api -f','journalctl -fu api','journalctl -f -u api','journalctl --follow -u api','journalctl -u api --follow'], explanation:'`-u` выбирает юнит, `-f` следит за новыми строками, как tail -f.' }
]},
{ id:'1-4', title:'Ресурсы и диагностика',
html:`
<p>Сервис тормозит или падает. Прежде чем читать код, проверьте четыре ресурса: CPU, память, диск и сеть. Это занимает минуту.</p>
<h3>CPU и нагрузка</h3>
<pre><span class="p">$ </span>uptime
 14:02:11 up 31 days,  2 users,  load average: 7.85, 6.12, 3.40</pre>
<p><b>Load average</b> — среднее число процессов, которые работают или ждут CPU (и диск) за 1, 5 и 15 минут. Сравнивайте с числом ядер (<code>nproc</code>): на 4 ядрах load 7,85 означает очередь. Рост слева направо — нагрузка увеличивается.</p>
<h3>Память</h3>
<pre><span class="p">$ </span>free -h
       total   used   free  shared  buff/cache  available
Mem:   7.7Gi  6.9Gi  180Mi   12Mi       620Mi      410Mi</pre>
<p>Смотрите на <code>available</code>, а не на <code>free</code>: Linux занимает свободную память под кэш и отдаёт её по требованию. Когда памяти не остаётся, ядро запускает <b>OOM killer</b> и убивает самый «тяжёлый» процесс. Следы ищите в <code>dmesg | grep -i oom</code>.</p>
<h3>Диск</h3>
<pre>df -h                    <span class="c"># занятость разделов</span>
df -i                    <span class="c"># занятость inode: место есть, а файлы не создаются</span>
du -sh /var/log/* | sort -h   <span class="c"># что занимает место</span></pre>
<p>Классика: диск заполнили логи или старые Docker-образы (<code>docker system df</code>, <code>docker image prune</code>). При 100% базы и сервисы падают с неочевидными ошибками.</p>
<h3>Сеть и порты</h3>
<pre>ss -tlnp                 <span class="c"># какие TCP-порты слушаются и каким процессом</span>
curl -sv localhost:8080/health
lsof -i :8080            <span class="c"># кто занял порт</span></pre>
<div class="note"><b>Порядок проверки</b>: <code>uptime</code> → <code>free -h</code> → <code>df -h</code> → <code>ss -tlnp</code> → <code>journalctl -u сервис</code>. Пять команд закрывают большую часть случаев «сервер странно себя ведёт».</div>`,

{ id:'2-1', title:'Потоки, перенаправления и пайпы',
html:`
<p>У каждого процесса три стандартных потока: <b>stdin</b> (0, ввод), <b>stdout</b> (1, обычный вывод) и <b>stderr</b> (2, ошибки). Оболочка позволяет перенаправлять их в файлы и в другие программы.</p>
<div class="tbl"><table>
<tr><th>Запись</th><th>Что делает</th></tr>
<tr><td><code>cmd &gt; out.txt</code></td><td>stdout в файл (перезаписать)</td></tr>
<tr><td><code>cmd &gt;&gt; out.txt</code></td><td>stdout в файл (дописать в конец)</td></tr>
<tr><td><code>cmd 2&gt; err.txt</code></td><td>только ошибки в файл</td></tr>
<tr><td><code>cmd &gt; all.log 2&gt;&amp;1</code></td><td>stdout и stderr в один файл</td></tr>
<tr><td><code>cmd &gt; /dev/null</code></td><td>выбросить вывод</td></tr>
<tr><td><code>cmd1 | cmd2</code></td><td>stdout первой команды на stdin второй</td></tr>
</table></div>
<p>Порядок в <code>&gt; all.log 2&gt;&amp;1</code> важен: «2&gt;&amp;1» значит «отправь stderr туда же, куда сейчас идёт stdout». Если написать наоборот, ошибки уйдут на экран.</p>
<h3>Набор для разбора логов</h3>
<pre>grep -i error app.log            <span class="c"># строки с error без учёта регистра</span>
grep -c " 500 " access.log       <span class="c"># посчитать строки</span>
tail -f app.log | grep --line-buffered WARN
awk '{print $1}' access.log      <span class="c"># первое поле (по пробелам)</span>
sed 's/http:/https:/g' urls.txt  <span class="c"># замена</span>
sort | uniq -c | sort -rn        <span class="c"># частотный словарь</span></pre>
<h3>Пример: топ IP-адресов, получивших 5xx</h3>
<pre>awk '$9 ~ /^5/ {print $1}' /var/log/nginx/access.log \
  | sort | uniq -c | sort -rn | head -5</pre>
<p>Каждая программа делает одну вещь: awk выбирает строки с кодом 5xx и печатает IP, sort группирует одинаковые, <code>uniq -c</code> считает, второй sort упорядочивает по убыванию, head оставляет пять. Такие однострочники решают задачи, для которых не нужен отдельный скрипт.</p>
<div class="note"><b>xargs</b> превращает строки в аргументы: <code>find . -name "*.tmp" | xargs rm</code>. Для имён с пробелами используйте <code>find … -print0 | xargs -0</code>.</div>`,
check:[
{ id:'c2-1a', type:'single', prompt:'Как записать и обычный вывод, и ошибки команды в один файл?', options:['cmd > all.log 2>&1','cmd 2>&1 > all.log','cmd | all.log','cmd >> 2 all.log'], answer:0, explanation:'Сначала stdout направляется в файл, затем stderr туда же.' },
{ id:'c2-1b', type:'order', prompt:'Соберите конвейер «сколько раз встречается каждое значение, по убыванию».', options:['cut -d" " -f1 access.log','sort','uniq -c','sort -rn'], explanation:'uniq считает только соседние одинаковые строки, поэтому сначала нужен sort.' }
]},
{ id:'2-2', title:'Скрипты, которые не ломаются молча',
html:`
<p>Bash-скрипт — это команды, записанные в файл. Он нужен для деплоя, бэкапов, подготовки окружения. Главная опасность — по умолчанию Bash продолжает работать после ошибки.</p>
<pre>#!/usr/bin/env bash
set -euo pipefail

APP_DIR="/opt/api"
VERSION="\${1:?Укажите версию: ./deploy.sh 1.4.2}"
BACKUP="/var/backups/api-$(date +%F-%H%M).tar.gz"

log() { echo "[$(date +%T)] $*" &gt;&amp;2; }

log "Бэкап в $BACKUP"
tar -czf "$BACKUP" -C "$APP_DIR" .

for host in web1 web2; do
  log "Деплой $VERSION на $host"
  ssh "deploy@$host" "cd $APP_DIR &amp;&amp; ./update.sh $VERSION"
done

if curl -fsS "https://api.example.com/health" &gt; /dev/null; then
  log "Готово"
else
  log "Healthcheck не прошёл"; exit 1
fi</pre>
<h3>Разбор</h3>
<ul>
<li><code>#!/usr/bin/env bash</code> — шебанг: каким интерпретатором выполнять файл. Не забудьте <code>chmod +x</code>.</li>
<li><code>set -e</code> — выйти при первой ошибке; <code>-u</code> — ошибка при обращении к неопределённой переменной; <code>-o pipefail</code> — пайп считается упавшим, если упала любая его часть, а не только последняя.</li>
<li><code>"\${1:?текст}"</code> — первый аргумент, а если его нет, выход с сообщением. <code>"\${VAR:-default}"</code> подставит значение по умолчанию.</li>
<li><code>$(команда)</code> — подстановка вывода команды.</li>
<li><code>&amp;&amp;</code> — выполнить вторую команду, только если первая успешна; <code>||</code> — только если упала.</li>
</ul>
<h3>Кавычки</h3>
<p>Переменные почти всегда берите в двойные кавычки: <code>rm -rf "$DIR/tmp"</code>. Без кавычек пробел в значении разобьёт путь на два аргумента, а пустая переменная превратит команду в <code>rm -rf /tmp</code>. Одинарные кавычки не подставляют переменные вообще.</p>
<div class="note warn"><b>Почему set -u спасает.</b> Строка <code>rm -rf "$BUILD_DIR/"*</code> с опечаткой в имени переменной без <code>-u</code> удалит содержимое корня. С <code>-u</code> скрипт остановится с ошибкой.</div>
<p>Проверяйте скрипты линтером <b>ShellCheck</b>: он находит забытые кавычки и другие ловушки. Если скрипт перерос 100 строк и в нём появились структуры данных, пора переписать его на Python или Go.</p>`,
check:[
{ id:'c2-2a', type:'match', prompt:'Сопоставьте опцию и её эффект.', pairs:[['set -e','выход при ошибке любой команды'],['set -u','ошибка при неопределённой переменной'],['set -o pipefail','пайп падает, если упала любая его часть']], explanation:'Обычно все три включают одной строкой `set -euo pipefail`.' },
{ id:'c2-2b', type:'single', prompt:'Что выведет `echo \'$HOME\'` (в одинарных кавычках)?', options:['Буквально $HOME','Путь к домашнему каталогу','Пустую строку','Ошибку'], answer:0, explanation:'В одинарных кавычках подстановки не выполняются.' }
]},
{ id:'2-3', title:'SSH и задачи по расписанию',
html:`
<h3>SSH по ключам</h3>
<p>На серверы заходят по SSH, и только по ключам: пароли перебирают боты со всего интернета. Ключевая пара — приватный ключ (остаётся у вас) и публичный (кладётся на сервер).</p>
<pre>ssh-keygen -t ed25519 -C "dev@laptop"      <span class="c"># создать пару в ~/.ssh/</span>
ssh-copy-id deploy@203.0.113.10            <span class="c"># добавить публичный ключ в authorized_keys</span>
ssh deploy@203.0.113.10</pre>
<p>Чтобы не набирать адреса, заведите <code>~/.ssh/config</code>:</p>
<pre>Host prod-web
  HostName 203.0.113.10
  User deploy
  IdentityFile ~/.ssh/id_ed25519

Host db-private
  HostName 10.0.2.15
  ProxyJump prod-web           <span class="c"># зайти через бастион</span></pre>
<pre>ssh prod-web
rsync -avz ./dist/ prod-web:/opt/api/dist/     <span class="c"># синхронизировать файлы</span>
ssh -L 5432:localhost:5432 db-private          <span class="c"># пробросить порт базы к себе</span></pre>
<p>На сервере в <code>/etc/ssh/sshd_config</code> отключают вход по паролю и под root: <code>PasswordAuthentication no</code>, <code>PermitRootLogin no</code>.</p>
<h3>cron</h3>
<p>cron запускает команды по расписанию. Расписание — пять полей: минута, час, день месяца, месяц, день недели. Редактировать свой список задач — <code>crontab -e</code>.</p>
<pre><span class="c"># бэкап каждую ночь в 03:00, вывод в лог</span>
0 3 * * * /usr/local/bin/backup.sh &gt;&gt; /var/log/backup.log 2&gt;&amp;1</pre>
<div data-widget="cron"></div>
<h3>Ловушки cron</h3>
<ul>
<li>У cron минимальное окружение: другой <code>PATH</code>, нет переменных из <code>.bashrc</code>. Пишите полные пути к программам.</li>
<li>Без перенаправления вывод теряется. Всегда пишите лог.</li>
<li>Время — по часовому поясу сервера, часто UTC.</li>
<li>Если задача может работать дольше интервала, две копии наложатся. Защита — <code>flock -n /tmp/job.lock команда</code>.</li>
</ul>
<p>В Kubernetes вместо cron используют объект <b>CronJob</b> с тем же синтаксисом расписания, а в systemd — таймеры.</p>`,
check:[
{ id:'c2-3a', type:'single', prompt:'Когда выполнится задача `30 2 * * 1`?', options:['Каждый понедельник в 02:30','Каждый день в 02:30 и 01:00','2 числа каждого месяца в 00:30','Каждые 30 минут во второй час'], answer:0, explanation:'Минута 30, час 2, любой день и месяц, день недели 1 — понедельник.' },
{ id:'c2-3b', type:'single', prompt:'Какой ключ уходит на сервер при настройке входа по SSH-ключу?', options:['Публичный','Приватный','Оба','Никакой, только пароль'], answer:0, explanation:'Приватный ключ никогда не покидает вашу машину.' }
]}
  ],
  test:[
{ id:'t2-1', l:'2-1', type:'single', prompt:'Чем `>` отличается от `>>`?', options:['> перезаписывает файл, >> дописывает в конец','> пишет ошибки, >> обычный вывод','Ничем','>> работает только с /dev/null'], answer:0, explanation:'Если важно не потерять старое содержимое, используйте >>.' },
{ id:'t2-2', l:'2-1', type:'single', prompt:'Что делает `|` между командами?', options:['Передаёт stdout первой команды на stdin второй','Запускает команды параллельно без связи','Выполняет вторую, если первая упала','Сохраняет вывод в файл'], answer:0, explanation:'Пайп соединяет вывод и ввод.' },
{ id:'t2-3', l:'2-1', type:'analyze', prompt:'Что делает этот конвейер?', code:'grep " 404 " access.log | awk \'{print $7}\' | sort | uniq -c | sort -rn | head -3', options:['Показывает три самых частых URL, вернувших 404','Удаляет строки с 404','Считает общее количество запросов','Показывает три последних запроса'], answer:0, explanation:'Фильтр по 404 → поле с путём → подсчёт → сортировка по частоте → топ-3.' },
{ id:'t2-4', l:'2-2', type:'single', prompt:'Зачем нужен `set -o pipefail`?', options:['Чтобы ошибка в середине пайпа не терялась','Чтобы пайпы работали быстрее','Чтобы включить цветной вывод','Чтобы разрешить неопределённые переменные'], answer:0, explanation:'Без него код выхода пайпа — это код последней команды.' },

{ id:'t2-7', l:'2-3', type:'single', prompt:'Скрипт работает из терминала, но из cron падает с «command not found». Вероятная причина?', options:['В cron другой PATH; нужно указать полные пути','cron не умеет запускать bash','Нужно перезагрузить сервер','У скрипта нет расширения .sh'], answer:0, explanation:'Окружение cron минимально, переменные из .bashrc не загружаются.' },
{ id:'t2-8', l:'2-3', type:'input', prompt:'Запишите cron-расписание «каждые 15 минут».', answer:['*/15 * * * *','0,15,30,45 * * * *'], explanation:'Шаг */15 в поле минут.' },

  id:3, title:'Git и командная работа', short:'Модель Git, merge и rebase, стратегии ветвления',
  lessons:[
{ id:'3-1', title:'Как Git хранит историю',
html:`
<p>Git — основа любого конвейера: пайплайны запускаются по событиям в репозитории, деплой привязан к коммиту, откат — это возврат к старому коммиту. Поэтому полезно понимать модель, а не только помнить команды.</p>
<h3>Коммит — снимок, ветка — указатель</h3>
<ul>
<li><b>Коммит</b> — снимок всех файлов проекта плюс автор, сообщение и ссылка на родителя. Идентификатор — SHA-хеш, например <code>3f9c2ab</code>. Изменить коммит нельзя: любое изменение даёт новый хеш.</li>
<li><b>Ветка</b> — просто подвижный указатель на коммит. Создать ветку — записать 41 байт.</li>
<li><b>HEAD</b> — указатель на то, где вы сейчас (обычно на текущую ветку).</li>
</ul>
<div class="flow"><span>a1</span><b>←</b><span>b2</span><b>←</b><span>c3</span><b>←</b><span class="hl">d4 ← main ← HEAD</span></div>
<h3>Три зоны</h3>
<p>Рабочий каталог → <b>индекс</b> (staging area, то, что войдёт в коммит) → репозиторий.</p>
<pre>git status
git add src/api.ts             <span class="c"># в индекс</span>
git commit -m "fix: таймаут запроса к платежам"
git log --oneline --graph -10
git diff                       <span class="c"># изменения, ещё не добавленные в индекс</span>
git diff --staged              <span class="c"># что войдёт в коммит</span></pre>
<h3>Удалённые репозитории</h3>
<p><code>origin</code> — имя удалённого репозитория по умолчанию. <code>origin/main</code> — ваша локальная копия того, где была ветка main на сервере при последней синхронизации.</p>
<pre>git fetch            <span class="c"># скачать новые коммиты, ничего не меняя в ваших ветках</span>
git pull             <span class="c"># fetch + слить изменения в текущую ветку</span>
git push -u origin feature/payments</pre>
<div class="note"><b>Для CI важно:</b> пайплайн собирает конкретный коммит, а не «ветку». Поэтому образ тегируют хешем коммита: по тегу <code>app:3f9c2ab</code> всегда можно найти точный код, который работает в проде.</div>`,
check:[
{ id:'c3-1a', type:'single', prompt:'Что такое ветка в Git?', options:['Подвижный указатель на коммит','Полная копия всех файлов проекта','Отдельный репозиторий','Список изменённых файлов'], answer:0, explanation:'Поэтому ветки в Git создаются мгновенно.' },
{ id:'c3-1b', type:'single', prompt:'Чем `git fetch` отличается от `git pull`?', options:['fetch только скачивает изменения, pull ещё и сливает их в текущую ветку','Ничем','fetch отправляет изменения на сервер','pull работает только с тегами'], answer:0, explanation:'pull = fetch + merge (или rebase, если так настроено).' }
]},
{ id:'3-2', title:'Merge, rebase и откаты',
html:`
<p>Две ветки разошлись: в main появились новые коммиты, пока вы делали фичу. Объединить их можно двумя способами.</p>
<div class="cols">
<div><b>merge</b>Создаёт коммит слияния с двумя родителями. История честная, но с «ромбиками». Ничего не переписывает.</div>
<div><b>rebase</b>Переносит ваши коммиты поверх свежего main, создавая их заново с новыми хешами. История линейная.</div>
</div>
<pre>git switch feature/payments
git rebase main          <span class="c"># переиграть свои коммиты поверх main</span>
<span class="c"># или</span>
git merge main           <span class="c"># влить main в свою ветку</span></pre>
<p><b>Fast-forward</b> — частный случай: если ваша ветка просто впереди main, Git передвигает указатель без нового коммита.</p>
<div class="note warn"><b>Золотое правило:</b> не делайте rebase веток, которые уже забрали другие люди. Rebase меняет хеши, и у коллег история разойдётся. Свою личную ветку перед PR — можно, тогда пуш требует <code>git push --force-with-lease</code>.</div>
<h3>Конфликты</h3>
<p>Если обе ветки изменили одни и те же строки, Git останавливается и размечает файл:</p>
<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
timeout: 5000
=======
timeout: 10000
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/payments</pre>
<p>Выберите правильный вариант, удалите маркеры, затем <code>git add файл</code> и <code>git merge --continue</code> (или <code>git rebase --continue</code>). Передумали — <code>--abort</code>.</p>
<h3>Как отменять</h3>
<div class="tbl"><table>
<tr><th>Команда</th><th>Что делает</th><th>Когда</th></tr>
<tr><td><code>git revert &lt;sha&gt;</code></td><td>Новый коммит, отменяющий изменения</td><td>Коммит уже в общей ветке (main)</td></tr>
<tr><td><code>git reset --soft HEAD~1</code></td><td>Убрать последний коммит, изменения остаются в индексе</td><td>Локально, ещё не запушено</td></tr>
<tr><td><code>git reset --hard &lt;sha&gt;</code></td><td>Откатить ветку и рабочие файлы. Несохранённое теряется</td><td>Осторожно, только локально</td></tr>
<tr><td><code>git restore файл</code></td><td>Отменить незакоммиченные правки в файле</td><td>Рабочий каталог</td></tr>
</table></div>
<p>Потеряли коммит после reset? <code>git reflog</code> хранит, куда указывал HEAD, и почти всегда позволяет вернуться.</p>`,
check:[
{ id:'c3-2a', type:'single', prompt:'Плохой коммит уже попал в main и задеплоен. Как его безопасно отменить?', options:['git revert <sha> и запушить','git reset --hard HEAD~1 и git push --force','Удалить репозиторий','git commit --amend'], answer:0, explanation:'revert не переписывает общую историю, он добавляет отменяющий коммит.' },
{ id:'c3-2b', type:'single', prompt:'Почему нельзя делать rebase общей ветки, с которой работают коллеги?', options:['Rebase создаёт коммиты с новыми хешами, и история у коллег разойдётся','Rebase удаляет файлы','Rebase работает только локально','Это запрещено настройками GitHub'], answer:0, explanation:'Переписанная история конфликтует с копиями у других людей.' }

{ id:'3-3', title:'Стратегии ветвления и версии',
html:`
<p>Как команда организует ветки, напрямую влияет на скорость доставки. Три распространённые модели:</p>
<div class="cols">
<div><b>GitFlow</b>Ветки develop, release, hotfix, feature. Подходит для коробочных продуктов с редкими версиями. Для веб-сервисов тяжеловат: долгоживущие ветки, большие слияния.</div>
<div><b>GitHub Flow</b>Есть только main, который всегда готов к деплою. Фича — короткая ветка → PR → ревью и CI → merge → деплой.</div>
<div><b>Trunk-based</b>Все часто (раз в день и чаще) вливают маленькие изменения в main. Незаконченное прячут за фича-флагами. Рекомендация DORA для высокой скорости.</div>
</div>
<h3>Пулл-реквест как ворота качества</h3>
<ul>
<li>Ветку main защищают: прямой push запрещён, merge только после зелёного CI и одобрения ревьюера.</li>
<li>Маленький PR (до 200–400 строк) ревьюят быстро и внимательно; огромный — по диагонали.</li>
<li><b>Squash merge</b> сжимает коммиты ветки в один — история main становится читаемой.</li>
</ul>
<h3>Версии и теги</h3>
<p><b>Семантическое версионирование</b> — <code>MAJOR.MINOR.PATCH</code>, например 2.4.1:</p>
<ul>
<li>MAJOR — несовместимые изменения API;</li>
<li>MINOR — новая функциональность с обратной совместимостью;</li>
<li>PATCH — исправления ошибок.</li>
</ul>
<pre>git tag -a v2.4.1 -m "Release 2.4.1"
git push origin v2.4.1           <span class="c"># часто именно тег запускает релизный пайплайн</span></pre>
<p><b>Conventional Commits</b> — формат сообщений <code>feat: …</code>, <code>fix: …</code>, <code>feat!: …</code> (ломающее изменение). По нему инструменты сами вычисляют следующую версию и пишут changelog.</p>
<h3>Чего не должно быть в репозитории</h3>
<ul>
<li>Секретов: паролей, токенов, ключей. Даже удалённый в следующем коммите секрет остаётся в истории — его нужно отзывать и перевыпускать.</li>
<li>Артефактов сборки и зависимостей (<code>node_modules</code>, <code>dist</code>) — для этого <code>.gitignore</code>.</li>
<li><code>.env</code> с реальными значениями. Коммитят шаблон <code>.env.example</code>.</li>
</ul>`,

  id:4, title:'Контейнеры и Docker', short:'Как устроены контейнеры, Dockerfile, сети и тома, Compose',
  lessons:[
{ id:'4-1', title:'Что такое контейнер',
html:`
<p>Классическая проблема: «у меня работает, а на сервере нет». На сервере другая версия Node, нет нужной библиотеки, другой конфиг. Контейнер решает это: приложение едет вместе со своим окружением.</p>
<h3>Контейнер — это процесс</h3>
<p>Контейнер — не маленькая виртуальная машина, а обычный процесс Linux, которого ядро изолировало двумя механизмами:</p>
<ul>
<li><b>namespaces</b> — что процесс видит: свой список процессов (внутри он PID 1), свою сеть и IP, свою файловую систему, своё имя хоста.</li>
<li><b>cgroups</b> — сколько процесс может потребить: лимиты CPU, памяти, ввода-вывода.</li>
</ul>
<div class="tbl"><table>
<tr><th></th><th>Виртуальная машина</th><th>Контейнер</th></tr>
<tr><td>Ядро ОС</td><td>Своё у каждой ВМ</td><td>Общее с хостом</td></tr>
<tr><td>Старт</td><td>Десятки секунд</td><td>Доли секунды</td></tr>
<tr><td>Размер</td><td>Гигабайты</td><td>Мегабайты</td></tr>
<tr><td>Изоляция</td><td>Сильная (гипервизор)</td><td>Слабее: общее ядро</td></tr>
</table></div>
<p>Поэтому на Mac и Windows Docker Desktop запускает небольшую Linux-ВМ: Linux-контейнерам нужно Linux-ядро.</p>
<h3>Образ и контейнер</h3>
<ul>
<li><b>Образ</b> — неизменяемый шаблон: файловая система из слоёв плюс метаданные (какую команду запускать, какой порт). Аналогия — класс.</li>
<li><b>Контейнер</b> — запущенный экземпляр образа с тонким записываемым слоем сверху. Аналогия — объект. Удалили контейнер — записанное внутри пропало.</li>
<li><b>Реестр</b> (registry) — хранилище образов: Docker Hub, GitHub Container Registry, Amazon ECR.</li>
</ul>
<pre>docker run -d --name web -p 8080:80 nginx:1.27   <span class="c"># скачать образ и запустить</span>
docker ps                     <span class="c"># работающие контейнеры</span>
docker logs -f web            <span class="c"># логи (stdout/stderr главного процесса)</span>
docker exec -it web sh        <span class="c"># зайти внутрь</span>
docker stop web &amp;&amp; docker rm web</pre>
<div class="note">Формат образов и рантайма стандартизован (OCI). Образ, собранный Docker, запускают containerd в Kubernetes, Podman и любые облачные сервисы.</div>`,
check:[
{ id:'c4-1a', type:'match', prompt:'Сопоставьте механизм ядра и его роль.', pairs:[['namespaces','что процесс видит: PID, сеть, файловую систему'],['cgroups','сколько ресурсов процесс может потребить']], explanation:'Вместе они превращают обычный процесс в контейнер.' },
{ id:'c4-1b', type:'single', prompt:'Чем контейнер принципиально отличается от виртуальной машины?', options:['Использует ядро хоста, а не своё','Контейнер всегда безопаснее','Контейнер нельзя остановить','ВМ не может запускать Linux'], answer:0, explanation:'Общее ядро делает контейнеры лёгкими, но изоляция у них слабее.' }
]},
{ id:'4-2', title:'Dockerfile и кэш слоёв',
html:`
<p>Образ описывается <b>Dockerfile</b>: каждая инструкция создаёт слой. Docker кэширует слои: если инструкция и всё, что в неё копируется, не изменились, слой берётся из кэша. Но как только один слой изменился, все слои выше пересобираются.</p>
<pre>FROM node:20-alpine
WORKDIR /app
COPY package.json package-lock.json ./
RUN npm ci
COPY . .
RUN npm run build
EXPOSE 3000
CMD ["node", "dist/server.js"]</pre>
<h3>Главные инструкции</h3>
<ul>
<li><code>FROM</code> — базовый образ. Фиксируйте версию: <code>node:20.17-alpine</code>, а не <code>latest</code>.</li>
<li><code>WORKDIR</code> — рабочий каталог для следующих инструкций.</li>
<li><code>COPY</code> — скопировать файлы из контекста сборки в образ.</li>
<li><code>RUN</code> — выполнить команду при сборке.</li>
<li><code>ENV</code> — переменная окружения; <code>EXPOSE</code> — документирует порт (сам ничего не открывает).</li>
<li><code>CMD</code> / <code>ENTRYPOINT</code> — что запускать при старте контейнера.</li>
</ul>
<h3>Порядок решает</h3>
<p>Код меняется в каждом коммите, а зависимости — редко. Поэтому сначала копируют только файлы зависимостей и ставят их, а код — потом. Сравните:</p>
<div data-widget="layers"></div>
<h3>.dockerignore</h3>
<p>Всё в каталоге сборки отправляется демону как контекст. Без <code>.dockerignore</code> туда попадут <code>node_modules</code>, <code>.git</code> и <code>.env</code> с секретами — сборка медленнее, а секреты оказываются в образе.</p>
<pre><span class="c"># .dockerignore</span>
node_modules
.git
.env
dist
*.log</pre>
<pre>docker build -t orders-api:1.4.2 .
docker image ls
docker history orders-api:1.4.2     <span class="c"># слои и их размер</span></pre>`,
check:[
{ id:'c4-2a', type:'single', prompt:'Почему `COPY package.json` и `RUN npm ci` ставят до `COPY . .`?', options:['Чтобы правка кода не инвалидировала кэш установки зависимостей','Иначе npm не найдёт package.json','Так образ становится безопаснее','Docker требует этот порядок'], answer:0, explanation:'Слой с зависимостями пересобирается, только когда меняются файлы зависимостей.' },
{ id:'c4-2b', type:'single', prompt:'Что делает инструкция EXPOSE 3000?', options:['Документирует, что приложение слушает порт 3000; публикуется порт флагом -p','Открывает порт 3000 в интернет','Запускает приложение на порту 3000','Запрещает другие порты'], answer:0, explanation:'Публикация порта наружу — это `docker run -p` или настройка в Compose/Kubernetes.' }
]},
{ id:'4-3', title:'Сети и данные',
html:`
<h3>Порты</h3>
<p>У контейнера своя сеть. Чтобы достучаться до него с хоста, порт публикуют: <code>-p ХОСТ:КОНТЕЙНЕР</code>.</p>
<pre>docker run -d -p 8080:3000 orders-api:1.4.2
curl localhost:8080          <span class="c"># попадёт в порт 3000 внутри контейнера</span></pre>
<div class="note warn"><b>Частая ошибка:</b> приложение внутри слушает <code>127.0.0.1:3000</code>. Тогда снаружи контейнера до него не достучаться, даже с <code>-p</code>. В контейнере сервер должен слушать <code>0.0.0.0</code>.</div>
<h3>Сеть между контейнерами</h3>
<p>Контейнеры в одной пользовательской сети находят друг друга по имени: встроенный DNS Docker превращает имя контейнера в его IP.</p>
<pre>docker network create app-net
docker run -d --name db --network app-net -e POSTGRES_PASSWORD=dev postgres:16
docker run -d --name api --network app-net -e DATABASE_HOST=db orders-api:1.4.2</pre>
<p>Внутри <code>api</code> адрес базы — <code>db:5432</code>, а не <code>localhost</code>: localhost в контейнере — это сам контейнер.</p>
<h3>Данные</h3>
<p>Записываемый слой контейнера исчезает вместе с ним. Всё, что нужно сохранить, выносится наружу:</p>
<div class="cols">
<div><b>Volume</b><code>-v pgdata:/var/lib/postgresql/data</code><br>Docker сам управляет хранилищем. Для данных баз и всего, что должно пережить контейнер.</div>
<div><b>Bind mount</b><code>-v ./src:/app/src</code><br>Каталог хоста монтируется внутрь. Удобно в разработке для горячей перезагрузки кода.</div>
<div><b>tmpfs</b><code>--tmpfs /tmp</code><br>Временные файлы в памяти, не пишутся на диск.</div>
</div>
<p>Конфигурацию передают переменными окружения (<code>-e</code>, <code>--env-file</code>) — тогда один образ работает в любом окружении. Это один из принципов <b>Twelve-Factor App</b>.</p>`,
check:[
{ id:'c4-3a', type:'single', prompt:'Контейнер api и контейнер db в одной docker-сети. Какой адрес базы указать в api?', options:['db:5432','localhost:5432','127.0.0.1:5432','0.0.0.0:5432'], answer:0, explanation:'Встроенный DNS Docker резолвит имя контейнера; localhost — это сам контейнер api.' },

]},
{ id:'4-4', title:'Docker Compose и хорошие образы',
html:`
<p>Когда контейнеров несколько, запускать их командами неудобно. <b>Docker Compose</b> описывает всё окружение в одном файле.</p>
<pre><span class="c"># compose.yaml</span>
services:
  api:
    build: .
    ports: ["8080:3000"]
    environment:
      DATABASE_URL: postgres://app:dev@db:5432/orders
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
volumes:
  pgdata:</pre>
<pre>docker compose up -d --build
docker compose logs -f api
docker compose down          <span class="c"># остановить (тома сохранятся; -v удалит и их)</span></pre>
<p><code>depends_on</code> без условия ждёт только <i>запуска</i> контейнера, а не готовности базы. Поэтому нужен healthcheck и <code>condition: service_healthy</code>.</p>
<h3>Multi-stage сборка</h3>
<p>Для сборки нужны компиляторы и dev-зависимости, для запуска — нет. Multi-stage позволяет собрать в одном образе, а в итоговый скопировать только результат:</p>
<pre>FROM node:20-alpine AS build
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build &amp;&amp; npm prune --omit=dev

FROM node:20-alpine
WORKDIR /app
COPY --from=build /app/node_modules ./node_modules
COPY --from=build /app/dist ./dist
USER node
CMD ["node", "dist/server.js"]</pre>
<h3>Чек-лист хорошего образа</h3>
<ul>
<li>Конкретная версия базового образа, лучше slim/alpine/distroless.</li>
<li>Multi-stage: в итоговом образе нет исходников и инструментов сборки.</li>
<li><code>USER</code> — не root.</li>
<li>Один процесс на контейнер; логи в stdout/stderr, а не в файлы.</li>
<li>Exec-форма <code>CMD ["node", "server.js"]</code>: тогда приложение — PID 1 и получает SIGTERM. В shell-форме <code>CMD node server.js</code> сигнал получит sh.</li>
<li>Никаких секретов в образе: их передают при запуске.</li>
<li>Сканирование уязвимостей: <code>trivy image orders-api:1.4.2</code>.</li>
</ul>`,

  id:5, title:'CI/CD', short:'Конвейеры, GitHub Actions, артефакты и секреты, стратегии деплоя',
  lessons:[
{ id:'5-1', title:'Непрерывная интеграция',
html:`
<p><b>CI (Continuous Integration)</b> — практика, при которой разработчики вливают изменения в общую ветку часто, а каждое изменение автоматически собирается и проверяется. Цель — узнать о поломке через минуты после коммита, а не через неделю на «интеграционном этапе».</p>
<h3>Типичный конвейер</h3>
<div class="flow"><span>checkout</span><b>→</b><span>install</span><b>→</b><span>lint</span><b>→</b><span>unit-тесты</span><b>→</b><span>build</span><b>→</b><span>интеграционные тесты</span><b>→</b><span class="hl">артефакт</span></div>
<ul>
<li><b>Быстрая обратная связь.</b> Конвейер на PR должен укладываться в 5–10 минут. Медленные проверки распараллеливают или выносят в ночные прогоны.</li>
<li><b>Fail fast.</b> Дешёвые проверки (линтер, юнит-тесты) идут первыми: незачем 10 минут собирать образ, если в коде опечатка.</li>
<li><b>Чистое окружение.</b> Каждый запуск на свежей машине или в контейнере — так находятся зависимости, которые «случайно есть» на ноутбуке.</li>
<li><b>Красный main — приоритет.</b> Если основная ветка сломана, команда сначала чинит её.</li>
</ul>
<h3>Пирамида тестов</h3>
<div class="cols">
<div><b>Unit</b>Много, миллисекунды, без сети и базы. Основание пирамиды.</div>
<div><b>Integration</b>Меньше: код вместе с реальной базой, очередью (часто в контейнерах).</div>
<div><b>E2E</b>Мало: сценарий пользователя через браузер или API. Медленные и хрупкие.</div>
</div>
<h3>Flaky-тесты</h3>
<p>Тест, который то проходит, то падает без изменений кода, разрушает доверие к CI: люди привыкают нажимать «перезапустить» и пропускают настоящие ошибки. Такие тесты чинят или временно выключают с задачей на исправление.</p>
<div class="note"><b>CI, CD и CD.</b> Continuous Integration — проверка каждого изменения. <b>Continuous Delivery</b> — каждое изменение в main готово к релизу, деплой в прод по кнопке. <b>Continuous Deployment</b> — в прод уходит автоматически всё, что прошло конвейер.</div>`,
check:[
{ id:'c5-1a', type:'single', prompt:'Чем Continuous Delivery отличается от Continuous Deployment?', options:['В Delivery выкладка в прод по решению человека, в Deployment — автоматически','Это одно и то же','Delivery — только для мобильных приложений','Deployment не требует тестов'], answer:0, explanation:'В обоих случаях артефакт всегда готов, разница — в последнем шаге.' },
{ id:'c5-1b', type:'single', prompt:'Почему линтер и юнит-тесты ставят в начало конвейера?', options:['Они быстрые и дешёвые: ошибки находятся раньше, чем запустятся долгие шаги','Так требует GitHub','Они самые важные','Иначе сборка не начнётся'], answer:0, explanation:'Принцип fail fast экономит время и ресурсы.' }
]},
{ id:'5-2', title:'GitHub Actions на практике',
html:`
<p>GitHub Actions — встроенный в GitHub CI. Конвейер описывается YAML-файлом в <code>.github/workflows/</code>. Похожим образом устроены GitLab CI (<code>.gitlab-ci.yml</code>) и другие системы.</p>
<pre><span class="c"># .github/workflows/ci.yml</span>
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/acme/orders-api:\${{ github.sha }} .
          docker push ghcr.io/acme/orders-api:\${{ github.sha }}</pre>
<h3>Словарь</h3>
<ul>
<li><b>on</b> — события-триггеры: push, pull_request, тег, расписание (<code>schedule</code> с cron), ручной запуск (<code>workflow_dispatch</code>).</li>
<li><b>job</b> — набор шагов на одной машине (раннере). Джобы по умолчанию идут параллельно; <code>needs</code> задаёт зависимость.</li>
<li><b>step</b> — команда (<code>run</code>) или готовое действие (<code>uses</code>).</li>
<li><b>matrix</b> — запустить джобу для нескольких комбинаций параметров.</li>
<li><b>runner</b> — машина, на которой выполняется джоба: облачная от GitHub или своя (self-hosted).</li>
</ul>
<h3>Скорость</h3>
<ul>
<li>Кэш зависимостей (<code>cache: npm</code>, <code>actions/cache</code>) экономит минуты на каждом запуске.</li>
<li>Кэш слоёв Docker в CI: <code>docker/build-push-action</code> с <code>cache-from: type=gha</code>.</li>
<li>Фиксируйте версии действий (<code>@v4</code>, а для чувствительных — полный SHA): чужое действие выполняется с доступом к вашему коду и токенам.</li>
</ul>`,
check:[
{ id:'c5-2a', type:'single', prompt:'Как сделать так, чтобы джоба deploy запускалась только после успешной джобы test?', options:['needs: test','depends: test','after: test','Поставить её ниже в файле'], answer:0, explanation:'Без needs джобы выполняются параллельно.' },
{ id:'c5-2b', type:'input', prompt:'В каком каталоге репозитория лежат файлы workflow GitHub Actions?', answer:['.github/workflows','.github/workflows/'], explanation:'Каждый YAML-файл там — отдельный workflow.' }
]},
{ id:'5-3', title:'Артефакты, окружения и секреты',
html:`
<h3>Собери один раз — разворачивай везде</h3>
<p>Артефакт собирают <b>один раз</b> и один и тот же образ продвигают по окружениям: staging → production. Если пересобирать для прода отдельно, в прод может уехать не то, что тестировали (обновилась зависимость, изменился базовый образ).</p>
<div class="flow"><span>commit 3f9c2ab</span><b>→</b><span class="hl">app:3f9c2ab</span><b>→</b><span>staging</span><b>→</b><span>production</span></div>
<p>Отличия окружений — только в конфигурации: переменные окружения, адреса, секреты. Образ одинаковый.</p>
<h3>Теги образов</h3>
<ul>
<li><code>app:3f9c2ab</code> — неизменяемый тег по коммиту. Его и деплоят.</li>
<li><code>app:1.4.2</code> — версия релиза, удобна людям.</li>
<li><code>app:latest</code> — плавающий тег: сегодня одно, завтра другое. В манифестах прода не используйте — неясно, что работает, и откат невозможен.</li>
</ul>
<h3>Окружения и защита</h3>
<p>В GitHub Actions есть <b>environments</b>: у окружения production могут быть обязательные ревьюеры, ограничение по веткам и свои секреты. Деплой ждёт нажатия «Approve».</p>
<pre>  deploy-prod:
    needs: deploy-staging
    environment: production     <span class="c"># ждёт одобрения, берёт секреты окружения</span>
    runs-on: ubuntu-latest</pre>
<h3>Секреты</h3>
<ul>
<li>Храните в хранилище секретов CI (GitHub Secrets) или во внешнем — HashiCorp Vault, AWS Secrets Manager. Никогда в репозитории.</li>
<li>CI маскирует секреты в логах, но <code>echo $TOKEN | base64</code> маску обойдёт. Не выводите секреты вообще.</li>
<li>Принцип минимальных прав: токен для деплоя в staging не должен уметь трогать прод.</li>
<li>Вместо долгоживущих ключей облака используйте <b>OIDC</b>: CI получает у облака короткоживущий токен, доверие настраивается по репозиторию и ветке.</li>
<li>Пулл-реквесты из форков не получают секреты — иначе любой мог бы их украсть, изменив workflow.</li>
</ul>`,
check:[
{ id:'c5-3a', type:'single', prompt:'Почему в прод деплоят тот же образ, что тестировали на staging, а не пересобирают его?', options:['Пересборка может дать другой результат: новые версии зависимостей или базового образа','Пересборка запрещена Docker','Так дешевле хранить образы','Staging и прод используют разные языки'], answer:0, explanation:'Принцип build once, deploy many гарантирует, что в проде проверенный артефакт.' },
{ id:'c5-3b', type:'single', prompt:'Чем плох тег latest в манифестах продакшена?', options:['Непонятно, какая версия запущена, и нельзя надёжно откатиться','Он медленнее скачивается','Kubernetes его не поддерживает','Он занимает больше места'], answer:0, explanation:'Плавающий тег указывает на разные образы в разное время.' }
]},
{ id:'5-4', title:'Стратегии деплоя',
html:`
<p>Как заменить работающую версию новой так, чтобы пользователи не заметили, а при проблеме можно было быстро вернуться назад? Сравните четыре стратегии по шагам:</p>
<div data-widget="rollout"></div>
<div class="tbl"><table>
<tr><th>Стратегия</th><th>Простой</th><th>Доп. ресурсы</th><th>Откат</th><th>Риск</th></tr>
<tr><td>Recreate</td><td>Есть</td><td>Нет</td><td>Повторный деплой</td><td>Все пользователи сразу</td></tr>
<tr><td>Rolling</td><td>Нет</td><td>Немного (surge)</td><td>Обратная раскатка</td><td>Растёт постепенно</td></tr>
<tr><td>Blue-green</td><td>Нет</td><td>×2 на время деплоя</td><td>Мгновенный</td><td>Все сразу, но откат быстрый</td></tr>
<tr><td>Canary</td><td>Нет</td><td>Немного</td><td>Быстрый</td><td>Малая доля пользователей</td></tr>
</table></div>
<h3>Фича-флаги</h3>
<p>Флаг — условие в коде: <code>if (flags.newCheckout) {…}</code>. Код деплоится выключенным, а включается в панели: сначала для сотрудников, потом для 10% пользователей, потом для всех. Выключить флаг быстрее любого отката. Старые флаги нужно удалять, иначе код обрастает ветвлениями.</p>
<h3>Миграции базы данных</h3>
<p>При rolling и canary две версии работают одновременно с одной базой. Поэтому схему меняют в несколько шагов (<b>expand/contract</b>):</p>
<ol>
<li>Добавить новую колонку, старая остаётся (обе версии кода работают).</li>
<li>Задеплоить код, который пишет в обе и читает новую.</li>
<li>Перенести данные.</li>
<li>Следующим релизом удалить старую колонку.</li>
</ol>
<div class="note"><b>Откат должен быть отрепетирован.</b> Если вы ни разу не откатывались, в момент инцидента окажется, что миграция необратима или старый образ удалён из реестра.</div>`,

  id:6, title:'Kubernetes', short:'Архитектура, Deployment, Service и Ingress, пробы и отладка',

{ id:'6-1', title:'Зачем нужен оркестратор',
html:`
<p>Docker запускает контейнеры на одной машине. Но у вас 20 сервисов по нескольку копий, 10 серверов, и один из них только что умер. Кто перезапустит контейнеры на других машинах, распределит нагрузку и выкатит новую версию без простоя? Это делает <b>оркестратор</b>. Стандарт индустрии — <b>Kubernetes</b> (k8s).</p>
<h3>Декларативная модель</h3>
<p>Вы не говорите «запусти контейнер». Вы описываете <b>желаемое состояние</b>: «должно работать 3 копии образа <code>orders-api:3f9c2ab</code>». Контроллеры Kubernetes в бесконечном цикле сравнивают желаемое с фактическим и устраняют разницу. Упала нода — подов стало 2 — контроллер создаёт третий на другой ноде.</p>
<div class="flow"><span>желаемое состояние</span><b>→</b><span class="hl">контроллер сравнивает</span><b>→</b><span>действие</span><b>→</b><span>фактическое состояние</span><b>↺</b></div>
<h3>Из чего состоит кластер</h3>
<div class="cols">
<div><b>Control plane</b>
<code>kube-apiserver</code> — единственная точка входа, все общаются через него.<br>
<code>etcd</code> — хранилище всего состояния кластера.<br>
<code>scheduler</code> — выбирает, на какую ноду поставить под.<br>
<code>controller-manager</code> — циклы контроллеров.</div>
<div><b>Рабочие ноды</b>
<code>kubelet</code> — агент: запускает поды, назначенные ноде, и докладывает их статус.<br>
<code>container runtime</code> — containerd, собственно запускает контейнеры.<br>
<code>kube-proxy</code> — правила сети для Service.</div>
</div>
<h3>kubectl</h3>
<pre>kubectl get nodes
kubectl get pods -n shop -o wide
kubectl apply -f deployment.yaml     <span class="c"># привести кластер к описанию из файла</span>
kubectl describe pod orders-api-7d9f-x2k
kubectl explain deployment.spec       <span class="c"># документация по полям</span></pre>
<p>Ресурсы группируются в <b>namespace</b> — логические разделы кластера (например, по командам или окружениям).</p>
<div class="note">Управляемые кластеры (EKS, GKE, AKS, Yandex Managed Kubernetes) берут control plane на себя. Для учёбы локально подойдут kind, minikube или k3d.</div>`,

{ id:'c6-1b', type:'single', prompt:'Что значит «декларативная модель» в Kubernetes?', options:['Вы описываете желаемое состояние, а контроллеры приводят к нему кластер','Вы пишете скрипт с последовательностью команд','Kubernetes выполняет команды только один раз','Состояние хранится только в YAML-файлах у разработчика'], answer:0, explanation:'Контроллеры постоянно сверяют фактическое состояние с желаемым.' }

{ id:'6-2', title:'Pod, ReplicaSet, Deployment',
html:`
<ul>
<li><b>Pod</b> — минимальная единица: один или несколько контейнеров с общим IP и томами. Поды смертны: при падении ноды под не «переезжает», вместо него создаётся новый, с новым IP.</li>
<li><b>ReplicaSet</b> — поддерживает заданное число одинаковых подов.</li>
<li><b>Deployment</b> — управляет ReplicaSet-ами и умеет обновлять версии: rolling update и откат. Именно его вы описываете для stateless-сервиса.</li>
</ul>
<pre>apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels: { app: orders-api }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/orders-api:3f9c2ab
          ports: [{ containerPort: 3000 }]</pre>
<h3>Метки и селекторы</h3>
<p>Связи в Kubernetes строятся не по именам, а по <b>меткам</b> (labels). Deployment управляет всеми подами с меткой <code>app: orders-api</code>; Service отправляет трафик на поды с этой же меткой. Метка в <code>selector</code> и в <code>template</code> должна совпадать.</p>
<h3>Обновление и откат</h3>
<pre>kubectl set image deploy/orders-api api=ghcr.io/acme/orders-api:9e1d07c -n shop
kubectl rollout status deploy/orders-api -n shop
kubectl rollout history deploy/orders-api -n shop
kubectl rollout undo deploy/orders-api -n shop     <span class="c"># вернуть предыдущую версию</span>
kubectl scale deploy/orders-api --replicas=5 -n shop</pre>
<p>В реальной жизни правят не командой, а YAML в Git, и CI или GitOps-инструмент (Argo CD, Flux) применяет его. Ручные <code>kubectl edit</code> в проде расходятся с репозиторием.</p>
<div class="note">Для баз данных и других сервисов с состоянием есть <b>StatefulSet</b> (стабильные имена и свои тома), для агента на каждой ноде — <b>DaemonSet</b>, для разовых задач — <b>Job</b> и <b>CronJob</b>.</div>`,

{ id:'c6-2a', type:'single', prompt:'Под с приложением упал вместе с нодой. Что произойдёт, если он создан Deployment-ом?', options:['ReplicaSet создаст новый под на другой ноде, с новым IP','Под переедет со старым IP','Ничего, нужно создать вручную','Kubernetes перезагрузит ноду'], answer:0, explanation:'Поды не переносятся, они пересоздаются.' },
